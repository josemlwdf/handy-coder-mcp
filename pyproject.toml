[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handy-coder-mcp"
version = "2.0.0"
description = "Workspace-confined MCP server for coding agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "pydantic>=2,<3", "tree-sitter>=0.23,<0.26", "tree-sitter-c-sharp>=0.23,<0.24", "beautifulsoup4>=4.12,<5", "jsbeautifier>=1.15,<2", "pytest", "ruff", "syntax_checker", "py_compile", "pycompile"]

[project.optional-dependencies]
continue = ["pyyaml>=6"]

[project.scripts]
handy-coder-mcp = "handy_coder_mcp:main"

[tool.setuptools]
py-modules = ["handy_coder_mcp"]
packages = ["lib", "lib.core", "lib.extras", "lib.subagents", "lib.utils"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
